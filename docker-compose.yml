services:
  nxgate:
    image: ghcr.io/xiumuzidiao0/nxgate:latest
    build: .
    container_name: nxgate
    restart: unless-stopped
    # 纯用户态免 TUN 模式（无需任何 --privileged、无需 CAP_NET_ADMIN、无需 /dev/net/tun）
    ports:
      - "${NXGATE_UI_PUBLISH_HOST:-0.0.0.0}:8787:8787"  # Web 默认发布到全部 IPv4 接口；可设为 127.0.0.1
      - "127.0.0.1:7928:7928"  # SOCKS5 / HTTP 多出口矩阵代理端口
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - UI_HOST=0.0.0.0
      - UI_PORT=8787
      - LOCAL_PROXY_HOST=0.0.0.0
      - LOCAL_PROXY_PORT=7928
      # 可选自定义后台路径与认证（默认随机安全路径）
      # - UI_PATH=/enter
      # - UI_USERNAME=admin
      # - UI_PASSWORD=your_password

      # 首次随机密码保存在 ./data/ui_password.txt；网页修改保存在 ./data/settings.json。
      # settings.json 优先于对应初始化环境变量；公网请通过 HTTPS 反代并限制来源。
      # 只需本地管理时：在 .env 写入 NXGATE_UI_PUBLISH_HOST=127.0.0.1，再 docker compose up -d
