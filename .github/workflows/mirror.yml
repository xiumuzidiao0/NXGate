name: Update VPNGate Mirror

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mirror:
    name: Fetch & Update Mirror Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Fetch and Validate Latest VPNGate Nodes
        run: |
          go run ./cmd/mirror

      - name: Publish Mirror Snapshot to Data Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage mirror files in a temp directory
          TMP_MIRROR_DIR=$(mktemp -d)
          cp -r mirror/* "${TMP_MIRROR_DIR}/"
          
          # Switch to an orphan data branch (only keeps latest snapshot, zero historical bloat)
          git checkout --orphan data
          git rm -rf .
          mkdir -p mirror
          cp -r "${TMP_MIRROR_DIR}"/* mirror/
          
          git add mirror/
          git commit -m "chore: automated VPNGate mirror snapshot [skip ci]"
          git push -f origin data
