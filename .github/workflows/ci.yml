name: CI Test & Build Validation

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      network_integration:
        description: 'Run tests that contact public DNS/Cloudflare (optional)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check version consistency
        run: |
          chmod +x scripts/check-version.sh
          ./scripts/check-version.sh

      - name: Run Code Audit & Vulnerability Scanning
        run: |
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Run Go Unit Tests
        run: |
          go test -v -count=1 ./...

      - name: Run Security and Optimization Race Regressions
        run: go test -race ./pkg/dns ./pkg/config ./pkg/nodes ./pkg/proxy ./pkg/sstp ./pkg/server ./pkg/tunnel -run 'TestSecurity|TestOptimization' -count=1

      - name: Run sing-box API Regression Tests
        run: |
          chmod +x scripts/singbox/tests/test_api.sh
          bash scripts/singbox/tests/test_api.sh

      - name: Install Web Test Dependencies & Chromium
        run: |
          npm --prefix web ci
          node web/node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Run Web UI Smoke Tests
        run: |
          npm --prefix web run build
          npm --prefix web run test:status
          npm --prefix web run test:ui

      - name: Verify Multi-arch Compilation
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          ls -lh dist/

  network-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.network_integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags=integration ./pkg/nodes ./pkg/tunnel -run '^TestIntegration' -count=1 -timeout=3m
