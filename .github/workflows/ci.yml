name: CI Test & Build Validation

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      network_integration:
        description: 'Run tests that contact public DNS/Cloudflare (optional)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Run Offline Installer Regressions
        run: |
          bash -n install.sh
          bash -n scripts/singbox/src/download.sh
          shellcheck --severity=error install.sh scripts/singbox/src/download.sh
          python3 scripts/tests/test_installer.py
          python3 scripts/tests/test_downloads.py
          bash scripts/test-security-cli.sh

      - name: Check version consistency
        run: |
          chmod +x scripts/check-version.sh
          ./scripts/check-version.sh

      - name: Run Code Audit & Vulnerability Scanning
        run: |
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Run Go Unit Tests
        run: |
          go test -v -count=1 ./...

      - name: Run Security and Optimization Race Regressions
        run: go test -race ./pkg/dns ./pkg/config ./pkg/nodes ./pkg/proxy ./pkg/sstp ./pkg/server ./pkg/tunnel -run 'TestSecurity|TestOptimization' -count=1

      - name: Run sing-box API Regression Tests
        run: |
          chmod +x scripts/singbox/tests/test_api.sh
          bash scripts/singbox/tests/test_api.sh

      - name: Build and Check Web Assets & Unit Tests
        run: |
          npm --prefix web install --no-audit --no-fund
          npm --prefix web run build
          git diff --exit-code web/dist/app.js
          npm --prefix web run test:i18n
          npm --prefix web run test:status

      - name: Run WebUI Playwright Smoke Tests
        run: |
          npx --prefix web playwright install --with-deps chromium
          npm --prefix web run test:ui

      - name: Verify Multi-arch Compilation
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          ls -lh dist/

  android-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Run Android debug unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

  network-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.network_integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags=integration ./pkg/nodes ./pkg/tunnel -run '^TestIntegration' -count=1 -timeout=3m
